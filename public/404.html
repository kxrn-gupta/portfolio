<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Kxrn</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="The requested page could not be found on kxrn.is-a.dev." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0a0f;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff, #64748b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      line-height: 1.1;
    }
    p {
      color: #94a3b8;
      font-size: 1.15rem;
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 600px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #38bdf8;
      color: #0a0a0f;
    }
    .btn-primary:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    footer {
      margin-top: 60px;
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>

  <div class="badge">HTTP 404 &bull; Route Unresolved</div>

  <p>The architecture, resource, or coordinate you requested does not exist or has been restructured.</p>
  
  <div class="nav-links">
    <a href="/" class="btn btn-primary">Return to Portfolio &rarr;</a>
    <a href="/projects" class="btn btn-secondary">All Projects</a>
    <a href="/music" class="btn btn-secondary">Music Discography</a>
    <a href="/links" class="btn btn-secondary">Official Links</a>

  <footer>
